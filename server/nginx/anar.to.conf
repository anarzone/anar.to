# anar.to: static files, reached through the Cloudflare Tunnel (cloudflared sends anar.to and www.anar.to to http://localhost:80).
# Releases live in /var/www/anar.to/releases/<id>; "current" points at the live one (see server/deploy-receive.sh).
# Install: copy to /etc/nginx/sites-available/anar.to, then: nginx -t && systemctl reload nginx

# Pages are checked on every visit (so a deploy shows up at once), and "no-transform" keeps Cloudflare from
# rewriting them: no email obfuscation script, no injected Web Analytics beacon.
map $sent_http_content_type $anar_to_page_cache {
    ~^text/html  "no-cache, no-transform";
    default      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name www.anar.to;
    return 301 https://anar.to$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name anar.to;
    server_tokens off;

    root /var/www/anar.to/current;
    index index.html;
    charset utf-8;

    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml application/wasm;

    # Cloudflare says how the visitor connected; plain http goes to https
    if ($http_cf_visitor ~ '"scheme":"http"') {
        return 301 https://anar.to$request_uri;
    }

    # Keep in sync with scripts/serve.py, which uses the same headers for local previews
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $anar_to_page_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Fingerprinted files never change (sql.js sits in a folder named after its version)
    location ^~ /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    # Icons, the share image, robots.txt and the sitemap
    location ~* \.(?:png|ico|txt|xml)$ {
        expires 1d;
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
